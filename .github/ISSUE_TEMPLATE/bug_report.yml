name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options:
        - usage-meter
        - guard-hooks
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin and Claude Code versions
      placeholder: "usage-meter 0.1.0, Claude Code 2.1.290"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
