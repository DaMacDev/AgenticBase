name: Release

# Keeps one release PR open on main: the next version of each changed plugin, from Conventional Commits.
# Merging it bumps that plugin's plugin.json and CHANGELOG.md and tags <plugin>-vX.Y.Z.
on:
  push:
    branches: [main]

concurrency:
  group: release-please
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The release PR is opened with the default token, so CI does not run on it: it only changes versions and changelogs.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
